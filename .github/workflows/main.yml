name: Refresh official tariff references
on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: solar-pages-and-tariffs
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh with validation and preserve last good data on source failure
        run: node scripts/tariff-sync.mjs
      - name: Record reference data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tariffs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update checked official tariff references'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Stage website files
        run: |
          mkdir -p _site/data
          cp index.html main.js style.css config.js _site/
          cp data/tariffs.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish refreshed website and references
        id: deployment
        uses: actions/deploy-pages@v4
